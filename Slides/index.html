<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Slides</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href= "/Clock/style.css">
    </head>
    <body>

        <div id="clock-container">
            <div id="clock">00000000</div>
        </div>

        <div class="slider">
            <div class="slides">
                <img src="Img/1.png" class="slide" alt="Img #1">
                <img src="Img/2.png" class="slide" alt="Img #2">
                <img src="Img/2708.jpg" width="100px" class="slide" alt="Img #3">
                <img src="Img/Cupcake.png" class="slide" alt="Img #4">
            </div>
            <button class="prev" onclick="prevSlide()">&#10094</button>
            <button class="next" onclick="nextSlide()">&#10095</button>
        </div>

        <script src="index.js"></script>
        <script src="index1.js"></script>
    </body>
</html>
